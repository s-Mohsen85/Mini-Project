<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام سایت</title>
    <link rel="stylesheet" href="../project1/project1.css">
</head>
<body>
    <div class="main">
        <img src="../../test.jpg" alt="pictur">
        <form>
            <div>
                <input type="text" placeholder="نام مستعار" required autofocus id="fname" class="input">
            </div>
            <div>
                <input type="email" placeholder="ایمیل" required id="mail">
            </div>
            <div>
                <input type="password" placeholder="رمز عبور" required id="password" maxlength="8">
            </div>
            <div>
                <input type="password" placeholder="تکرار رمز عبور" required id="repassword" maxlength="8">
            </div>
            <div>
                <input type="checkbox" required id="check">
                <label for="check">شرایط و قوانین سایت <a href="#">فلان</a> را میپذیرم</label>
            </div>
            <div>
                <input type="submit" value="ثبت نام" class="sub">
            </div>
        </form>
    </div>
</body>
</html>
